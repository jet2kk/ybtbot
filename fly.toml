app = "CHANGE-ME"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "8080"
  DATA_DIR = "/data"
  LAVALINK_PORT = "443"
  LAVALINK_SECURE = "true"
  DEFAULT_PREFIX = "!"
  PLAYING_ICON = "🐱"
  BOT_STATUS = "Music"
  PLAYER_DEBUG = "false"

[mounts]
  source = "bot_data"
  destination = "/data"

[[http_service]]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]
